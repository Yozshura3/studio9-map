<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#005FDA;--blue-light:#1a7aff;--red:#ef4444;--red-dark:#b91c1c;
  --green:#22C54F;--bg:#060611;--surface:#0c0c1d;--border:rgba(255,255,255,0.06);
}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:#e8e8ed;margin:0}
.s9-wrap{max-width:1200px;margin:0 auto;padding:48px 24px 60px}
.s9-hero{text-align:center;margin-bottom:40px}
.s9-hero h1{font-size:clamp(26px,4.5vw,48px);font-weight:700;letter-spacing:-0.03em;line-height:1.1;color:#fff}
.s9-hero h1 span{color:var(--green)}
.s9-hero p{font-size:16px;color:rgba(255,255,255,0.4);margin-top:14px;letter-spacing:0.01em}
.s9-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:32px;padding:14px 20px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}
.s9-dropdown{position:relative;min-width:260px}
.s9-dropdown-btn{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 16px;color:#e8e8ed;font-size:14px;font-weight:500;cursor:pointer;width:100%;font-family:inherit;transition:border-color 0.2s}
.s9-dropdown-btn.open{border-color:var(--blue)}
.s9-dropdown-btn .arrow{transition:transform 0.2s;font-size:12px;color:rgba(255,255,255,0.4)}
.s9-dropdown-btn.open .arrow{transform:rotate(180deg)}
.s9-dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#12121f;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:4px;z-index:100;box-shadow:0 12px 40px rgba(0,0,0,0.6);display:none}
.s9-dropdown-menu.open{display:block;animation:fadeIn 0.15s ease}
.s9-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:14px;transition:background 0.15s;color:#e8e8ed}
.s9-dropdown-item:hover{background:rgba(0,95,218,0.15)}
.s9-dropdown-item.active{background:rgba(0,95,218,0.15);color:var(--blue-light)}
.s9-legend{display:flex;align-items:center;gap:20px}
.s9-legend-item{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,0.5)}
.s9-dot{width:12px;height:12px;border-radius:50%}
.s9-dot.green{background:var(--green);box-shadow:0 0 8px rgba(34,197,79,0.4)}
.s9-dot.red{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.4)}
.s9-counter{font-size:13px;color:rgba(255,255,255,0.4)}
.s9-counter strong{color:var(--green);font-weight:700;font-size:16px}
.s9-map{position:relative;width:100%;max-width:750px;margin:0 auto 48px}
.s9-map svg{width:100%;height:auto}
.dept-path{transition:fill 0.2s,stroke 0.2s,filter 0.2s;cursor:pointer}
.dept-path:hover{filter:brightness(1.2) drop-shadow(0 0 8px rgba(34,197,79,0.5));stroke-width:2.5 !important;stroke:#fff !important}
.s9-tooltip{position:fixed;background:rgba(6,6,17,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:8px 14px;font-size:13px;color:#e8e8ed;pointer-events:none;z-index:1000;backdrop-filter:blur(12px);white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;align-items:center;gap:10px}
.s9-tooltip.show{display:flex}
.s9-tooltip .code{font-weight:700;color:#fff}
.s9-tooltip .name{color:rgba(255,255,255,0.6)}
.s9-tooltip .status{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.s9-tooltip .status.avail{background:rgba(34,197,79,0.15);color:var(--green)}
.s9-tooltip .status.taken{background:rgba(239,68,68,0.15);color:var(--red)}
.s9-grid-title{font-size:15px;font-weight:500;color:rgba(255,255,255,0.35);text-align:center;margin:16px 0 20px}
.s9-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.s9-grid-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid rgba(34,197,79,0.12);cursor:pointer;transition:all 0.2s;font-size:13px}
.s9-grid-card.taken{border-color:rgba(239,68,68,0.12)}
.s9-grid-card:hover{background:rgba(255,255,255,0.06);border-color:rgba(0,95,218,0.3);transform:translateY(-1px)}
.s9-grid-card .code{font-weight:700;font-size:13px;min-width:26px;color:#fff}
.s9-grid-card .name{flex:1;color:rgba(255,255,255,0.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s9-grid-card .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.s9-grid-card .dot.green{background:var(--green);box-shadow:0 0 6px rgba(34,197,79,0.35)}
.s9-grid-card .dot.red{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,0.35)}
/* Modal */
.s9-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:9998;display:none;align-items:center;justify-content:center;padding:24px}
.s9-overlay.open{display:flex;animation:fadeIn 0.15s ease}
.s9-modal{position:relative;background:#10101e;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:36px 32px 28px;max-width:460px;width:100%;animation:slideUp 0.2s ease}
.s9-modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,0.06);border:none;color:rgba(255,255,255,0.4);width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.15s;font-family:inherit}
.s9-modal-close:hover{background:rgba(255,255,255,0.12);color:#fff}
.s9-modal-badge{display:inline-block;background:rgba(0,95,218,0.13);color:var(--blue-light);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;letter-spacing:0.03em;margin-bottom:10px;border:1px solid rgba(0,95,218,0.2)}
.s9-modal-title{font-size:26px;font-weight:700;margin:6px 0 4px;letter-spacing:-0.02em;color:#fff}
.s9-modal-status{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin:10px 0 24px;padding:7px 16px;border-radius:24px}
.s9-modal-status.avail{background:rgba(34,197,79,0.1);color:var(--green);border:1px solid rgba(34,197,79,0.2)}
.s9-modal-status.taken{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.s9-modal-status .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.s9-modal-status.taken .pulse{background:var(--red);animation:none}
.s9-modal-label{font-size:11px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:12px}
.s9-modal-metiers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.s9-modal-metier{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05)}
.s9-modal-metier.taken{border-color:rgba(239,68,68,0.1)}
.s9-modal-metier .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.s9-cta{display:block;width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all 0.2s;font-family:inherit;letter-spacing:-0.01em;box-shadow:0 4px 16px rgba(0,95,218,0.3)}
.s9-cta:hover{filter:brightness(1.15);transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,95,218,0.4)}
.s9-cta.disabled{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.06);cursor:not-allowed;box-shadow:none}
.s9-cta.disabled:hover{filter:none;transform:none}
.s9-waitlist{font-size:12px;color:rgba(255,255,255,0.3);text-align:center;margin-top:10px}
.s9-waitlist a{color:var(--blue-light);text-decoration:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
</style>
</head>
<body>

<div class="s9-wrap">
  <!-- Hero -->
  <div class="s9-hero">
    <h1>Votre département est-il encore <span>disponible</span> ?</h1>
    <p>1 seul partenaire par département · Premier arrivé, premier servi</p>
  </div>

  <!-- Controls -->
  <div class="s9-controls">
    <div class="s9-dropdown">
      <button class="s9-dropdown-btn" id="dropdownBtn">
        <span class="icon" id="dropdownIcon">🧺</span>
        <span style="flex:1;text-align:left" id="dropdownLabel">Blanchisserie</span>
        <span class="arrow">▼</span>
      </button>
      <div class="s9-dropdown-menu" id="dropdownMenu"></div>
    </div>
    <div class="s9-legend">
      <div class="s9-legend-item"><div class="s9-dot green"></div>Disponible</div>
      <div class="s9-legend-item"><div class="s9-dot red"></div>Déjà réservé</div>
    </div>
    <div class="s9-counter"><strong id="availCount">0</strong> / <span id="totalCount">0</span> disponibles</div>
  </div>

  <!-- Map -->
  <div class="s9-map" id="mapContainer">
    <svg viewBox="0 0 1000 960" id="mapSvg"></svg>
  </div>

  <!-- Tooltip -->
  <div class="s9-tooltip" id="tooltip">
    <span class="code" id="ttCode"></span>
    <span class="name" id="ttName"></span>
    <span class="status" id="ttStatus"></span>
  </div>

  <!-- Grid -->
  <div class="s9-grid-title" id="gridTitle">Tous les départements — Blanchisserie</div>
  <div class="s9-grid" id="grid"></div>
</div>

<!-- Modal -->
<div class="s9-overlay" id="overlay">
  <div class="s9-modal" id="modal">
    <button class="s9-modal-close" id="modalClose">✕</button>
    <div class="s9-modal-badge" id="modalBadge"></div>
    <div class="s9-modal-title" id="modalTitle"></div>
    <div class="s9-modal-status" id="modalStatus">
      <div class="pulse"></div>
      <span id="modalStatusText"></span>
    </div>
    <div class="s9-modal-label">Disponibilité par secteur</div>
    <div class="s9-modal-metiers" id="modalMetiers"></div>
    <div id="modalCtaWrap"></div>
  </div>
</div>

const METIERS = [
  {key:"blanchisserie",label:"Blanchisserie",icon:"🧺"},
  {key:"espaces-verts",label:"Espaces Verts",icon:"🌿"},
  {key:"nettoyage-industriel",label:"Nettoyage Industriel",icon:"🧹"},
  {key:"recyclage-et-gestion-de-dechets",label:"Recyclage & Déchets",icon:"♻️"},
  {key:"maintenance-cvc",label:"Maintenance CVC",icon:"🔧"},
  {key:"signaletique-impression",label:"Signalétique & Impression",icon:"🖨️"},
];

// Availability — customize which departments are taken per métier
const TAKEN = {
  "blanchisserie": ["75","92"],
  "nettoyage-industriel": ["69","13"],
};

let selectedMetier = "blanchisserie";

function isAvail(code) {
  return !(TAKEN[selectedMetier] || []).includes(code);
}

// ─── Render Map ──────────────────────────────────────────────────────────────
const svg = document.getElementById("mapSvg");
const NS = "http://www.w3.org/2000/svg";

function renderMap() {
  svg.innerHTML = "";
  Object.entries(P).forEach(([code, {d}]) => {
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "dept-path");
    path.setAttribute("data-code", code);
    path.setAttribute("fill", isAvail(code) ? "#22C54F" : "#ef4444");
    path.setAttribute("stroke", "rgba(0,0,0,0.3)");
    path.setAttribute("stroke-width", "0.5");
    path.setAttribute("stroke-linejoin", "round");
    path.addEventListener("mouseenter", onPathEnter);
    path.addEventListener("mouseleave", onPathLeave);
    path.addEventListener("click", () => openModal(code));
    svg.appendChild(path);
  });
  updateCounter();
  renderGrid();
}

// ─── Tooltip ─────────────────────────────────────────────────────────────────
const tooltip = document.getElementById("tooltip");
const ttCode = document.getElementById("ttCode");
const ttName = document.getElementById("ttName");
const ttStatus = document.getElementById("ttStatus");

function onPathEnter(e) {
  const code = e.target.getAttribute("data-code");
  const dept = P[code];
  if (!dept) return;
  const avail = isAvail(code);
  ttCode.textContent = code;
  ttName.textContent = dept.n;
  ttStatus.textContent = avail ? "✓ Disponible" : "✕ Réservé";
  ttStatus.className = "status " + (avail ? "avail" : "taken");
  tooltip.classList.add("show");
}

function onPathLeave() {
  tooltip.classList.remove("show");
}

document.getElementById("mapContainer").addEventListener("mousemove", (e) => {
  tooltip.style.left = (e.clientX + 16) + "px";
  tooltip.style.top = (e.clientY - 10) + "px";
});

// ─── Dropdown ────────────────────────────────────────────────────────────────
const dropdownBtn = document.getElementById("dropdownBtn");
const dropdownMenu = document.getElementById("dropdownMenu");
const dropdownIcon = document.getElementById("dropdownIcon");
const dropdownLabel = document.getElementById("dropdownLabel");

function renderDropdown() {
  dropdownMenu.innerHTML = "";
  METIERS.forEach(m => {
    const div = document.createElement("div");
    div.className = "s9-dropdown-item" + (m.key === selectedMetier ? " active" : "");
    div.innerHTML = '<span style="font-size:16px">' + m.icon + '</span><span>' + m.label + '</span>' + (m.key === selectedMetier ? '<span style="margin-left:auto;font-size:12px">✓</span>' : '');
    div.addEventListener("click", () => {
      selectedMetier = m.key;
      dropdownIcon.textContent = m.icon;
      dropdownLabel.textContent = m.label;
      dropdownMenu.classList.remove("open");
      dropdownBtn.classList.remove("open");
      renderMap();
      document.getElementById("gridTitle").textContent = "Tous les départements — " + m.label;
      renderDropdown();
    });
    dropdownMenu.appendChild(div);
  });
}

dropdownBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  dropdownMenu.classList.toggle("open");
  dropdownBtn.classList.toggle("open");
});

document.addEventListener("click", () => {
  dropdownMenu.classList.remove("open");
  dropdownBtn.classList.remove("open");
});

// ─── Counter ─────────────────────────────────────────────────────────────────
function updateCounter() {
  const codes = Object.keys(P);
  const avail = codes.filter(c => isAvail(c)).length;
  document.getElementById("availCount").textContent = avail;
  document.getElementById("totalCount").textContent = codes.length;
}

// ─── Grid ────────────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  Object.keys(P).sort().forEach(code => {
    const dept = P[code];
    const avail = isAvail(code);
    const card = document.createElement("div");
    card.className = "s9-grid-card" + (avail ? "" : " taken");
    card.innerHTML = '<span class="code">' + code + '</span><span class="name">' + dept.n + '</span><div class="dot ' + (avail ? "green" : "red") + '"></div>';
    card.addEventListener("click", () => openModal(code));
    grid.appendChild(card);
  });
}

// ─── Modal ───────────────────────────────────────────────────────────────────
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");

function openModal(code) {
  const dept = P[code];
  if (!dept) return;
  const avail = isAvail(code);
  const metierLabel = METIERS.find(m => m.key === selectedMetier)?.label || "";

  document.getElementById("modalBadge").textContent = "Département " + code;
  document.getElementById("modalTitle").textContent = dept.n;

  const status = document.getElementById("modalStatus");
  status.className = "s9-modal-status " + (avail ? "avail" : "taken");
  document.getElementById("modalStatusText").textContent = avail ? "Disponible en " + metierLabel : "Déjà réservé en " + metierLabel;

  // Métiers grid
  const metiersEl = document.getElementById("modalMetiers");
  metiersEl.innerHTML = "";
  METIERS.forEach(m => {
    const a = !(TAKEN[m.key] || []).includes(code);
    const div = document.createElement("div");
    div.className = "s9-modal-metier" + (a ? "" : " taken");
    div.innerHTML = '<div class="dot" style="background:' + (a ? "var(--green)" : "var(--red)") + '"></div><span style="color:' + (a ? "rgba(255,255,255,0.6)" : "rgba(255,255,255,0.35)") + '">' + m.label + '</span>';
    metiersEl.appendChild(div);
  });

  // CTA
  const ctaWrap = document.getElementById("modalCtaWrap");
  if (avail) {
    ctaWrap.innerHTML = '<a href="https://studio-ix.fr/contact?dept=' + code + '&metier=' + selectedMetier + '" class="s9-cta">Réserver le ' + code + ' — ' + dept.n + '</a>';
  } else {
    ctaWrap.innerHTML = '<button class="s9-cta disabled" disabled>Ce département est déjà réservé</button><p class="s9-waitlist"><a href="https://studio-ix.fr/contact">Contactez-nous</a> pour être sur liste d\'attente</p>';
  }

  overlay.classList.add("open");
}

document.getElementById("modalClose").addEventListener("click", () => overlay.classList.remove("open"));
overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
modal.addEventListener("click", (e) => e.stopPropagation());

// ─── Init ────────────────────────────────────────────────────────────────────
renderDropdown();
renderMap();
</script>
</body>
</html>
